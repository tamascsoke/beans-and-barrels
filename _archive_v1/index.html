<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bean &amp; Barrel — Hamarosan</title>
  <meta name="description" content="Bean & Barrel — Kávé és Sör. Hamarosan érkezünk." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=League+Spartan:wght@700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="BEAN%20%26%20BARREL.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage">
    <div class="brand">
      <h1 class="brand__title">BEAN &amp; BARREL</h1>
      <svg class="brand__stroke" viewBox="0 0 520 26" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <filter id="chalk-disp" x="-4%" y="-100%" width="108%" height="300%">
            <feTurbulence type="fractalNoise" baseFrequency="0.78 0.42" numOctaves="5" seed="9" result="noise"/>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
          <filter id="chalk-grain" x="-4%" y="-100%" width="108%" height="300%">
            <feTurbulence type="fractalNoise" baseFrequency="1.1 0.7" numOctaves="3" seed="23" result="noise"/>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
        </defs>
        <!-- thick base chalk band -->
        <path filter="url(#chalk-disp)"
              d="M 4 11 C 40 8, 90 14, 150 10 S 240 14, 310 10 S 400 14, 470 10 S 510 12, 516 11
                 L 516 17 C 510 18, 470 16, 400 18 S 310 15, 240 18 S 150 15, 90 18 S 40 15, 4 16 Z"
              fill="rgba(255,255,255,0.92)"/>
        <!-- mid depth layer -->
        <path filter="url(#chalk-disp)"
              d="M 20 11 C 80 9, 180 14, 270 10 S 390 14, 480 11
                 L 480 16 C 390 18, 270 15, 180 17 S 80 14, 20 16 Z"
              fill="rgba(255,255,255,0.32)"/>
        <!-- chalk dust scatter -->
        <path filter="url(#chalk-grain)"
              d="M 8 12 C 100 9, 230 15, 350 11 S 470 15, 512 12
                 L 512 15 C 470 17, 350 14, 230 17 S 100 14, 8 15 Z"
              fill="rgba(255,255,255,0.22)"/>
      </svg>
      <p class="brand__sub">KÁVÉ ÉS SÖR</p>
    </div>

    <section class="coming">
      <p class="coming__label">HAMAROSAN<span class="coming__dots"> ...</span></p>
      <p class="coming__hint">Rendezvényekért keress: <a class="coming__email" href="mailto:info@beanbarrel.coffee">info@beanbarrel.coffee</a></p>
    </section>

  </main>
</body>
</html>
